<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditProfile</title>
    <link rel="stylesheet" href="Styles/EditProfile.css">
    <script src="Scripts/EditProfile.js"></script>
</head>

<body>

<header>
    <div id="main_header"></div>
</header>

<div class="container">
    <h1>Editar Perfil</h1>
    <div class="profile-section">
        <img src="/Images/account.png" alt="Foto de Perfil">
        <input type="file" id="profile-pic" name="profile-pic">
        <label for="profile-pic">Seleccionar Archivo</label>
    </div>
    <form action="Account.html">
        <div class="form-group">
            <label class="label" for="name">Nombre de la Cuenta</label>
            <input class="input-bar" type="text" id="name" name="name" placeholder="Tu Nombre" required>
        </div>
        <div class="form-group">
            <label class="label" for="email">Email</label>
            <input class="input-bar" type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
        </div>
        <form onsubmit="return validatePasswords()">
            <div class="form-group">
                <h2>Cambiar la contraseña</h2>
                <div class="form-group-horizontal">
                    <div>
                        <label class="label" for="current-password">Nueva contraseña</label>
                        <input class="input-bar" type="password" id="current-password" name="current-password" required>
                    </div>
                    <div>
                        <label class="label" for="new-password">Repita contraseña</label>
                        <input class="input-bar" type="password" id="new-password" name="new-password" required>
                    </div>
                </div>
                <button type="submit">Guardar Cambios</button>
            </div>
        </form>
        <div class="form-group">
            <h2>Eliminar cuenta</h2>
            <p>Tu cuenta, así como el contenido creado, guardado y gustado no se podrá restaurar después de la eliminación.</p>
            <input class="delete-button" type="button" value="Eliminar cuenta">
        </div>
        <div class="form-group-right">
            <input class="login-button" type="submit" value="Guardar Cambios" formaction="Account.html">
            <input class="logout-button" type="button" value="Cerrar sesión" onclick="window.location.href='index.html'">
        </div>
    </form>
</div>
<footer class="iframe-container">
    <div id="main_footer"></div>
</footer>

<script>
    loadTemplateFromSource("Templates/header.html", "main_header");
    loadTemplateFromSource("Templates/footer.html", "main_footer");
    setValidity();
</script>
</body>
</html>
