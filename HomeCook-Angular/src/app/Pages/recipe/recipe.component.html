<section id="main_step">
  <article>
    <header>
      <h1 id="RecipeTitle">Title of the Recipe</h1>
    </header>
    <div class="content">
      <div class="image-container">
        <figure>
          <img id="MainImage" src="../Images/img.png" width="600" alt="Food Image">
        </figure>
        <div class="rating">
          <span class="star" data-value="1">⭐</span>
          <span class="star" data-value="2">⭐</span>
          <span class="star" data-value="3">⭐</span>
          <span class="star" data-value="4">⭐</span>
          <span class="star" data-value="5">⭐</span>
        </div>
        <div class="actions">
          <button title="Me Gusta"><img src="../Images/heart_icon.png" alt="Me Gusta" width="30"></button>
          <button title="Guardar"><img src="../Images/saved.png" alt="Guardar" width="30"></button>
          <button title="Compartir"><img src="../Images/share.png" alt="Compartir" width="30"></button>
        </div>
      </div>
      <div class="ingredients">
        <h2>Ingredientes</h2>
        <label for="person-count">Número de personas:</label>
        <input type="number" id="person-count" name="person-count" value="1" min="1" max="10">
        <ul id="ingredient-list">
          <li class="ingredient" data-base-amount="1" data-unit="taza" data-name="de arroz">1 taza de arroz</li>
          <li class="ingredient" data-base-amount="2" data-unit="tazas" data-name="de agua">2 tazas de agua</li>
          <li class="ingredient" data-base-amount="1" data-unit="cucharadita" data-name="de sal">1 cucharadita de sal</li>
          <!-- Más ingredientes aquí -->
        </ul>
      </div>
    </div>
    <!-- Nueva sección de nutrición -->
    <div class="nutrition-section">
      <h2>Nutrición por ración</h2>
      <div class="nutrition-info">
        <div class="nutrition-item">
          <span>Cal</span>
          <div class="nutrition-value">1088</div>
        </div>
        <div class="nutrition-item">
          <span>Grasa</span>
          <div class="nutrition-value">70 g</div>
        </div>
        <div class="nutrition-item">
          <span>Proteína</span>
          <div class="nutrition-value">52 g</div>
        </div>
        <div class="nutrition-item">
          <span>Carb</span>
          <div class="nutrition-value">61 g</div>
        </div>
      </div>
    </div>

    <div id="bloque_de_pasos">
      <div id="steps_content" class="steps">
        <div id="steps_iframe"></div>
      </div>
    </div>
    <!-- Sección de recomendaciones -->
    <div>
    <h2 class="recommendations-title">Recomendaciones</h2>
    <div id="recommendations_iframe" ></div>
    </div>

  </article>
</section>
