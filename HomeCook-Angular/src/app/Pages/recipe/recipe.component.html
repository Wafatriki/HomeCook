<section id="main_step">
  <article>
    <header>
      <!-- Título de la receta cargado dinámicamente -->
      <h1 id="RecipeTitle">{{ recipe.name || 'Título de la receta no disponible' }}</h1>
    </header>
    <div class="content">
      <div class="image-container">
        <figure>
          <!-- Imagen principal de la receta cargada dinámicamente -->
          <img id="MainImage" [src]="recipe.Image || 'assets/Images/Icone.png'" width="600" alt="Imagen de la comida">
        </figure>
        <div class="rating">
          <span *ngFor="let star of [1, 2, 3, 4, 5]"
                class="star"
                [class.active]="star <= selectedRating"
                (click)="setRating(star)">
            ⭐
          </span>
        </div>



        <div class="actions">
          <button title="Me Gusta" (click)="toggleLike()">
            <img [src]="isLiked ? 'assets/Images/corazon.png' : 'assets/Images/heart_icon.png'" alt="Me Gusta" width="30">
          </button>

          <button title="Guardar" (click)="toggleSave()">
            <img [src]="isSaved ? 'assets/Images/saved2.png' : 'assets/Images/saved.png'" alt="Guardar" width="30">
          </button>

          <!-- Botón de compartir con menú desplegable -->
          <div class="share-container">
            <button title="Compartir" (click)="toggleShareMenu()">
              <img src="assets/Images/share.png" alt="Compartir" width="30">
            </button>

            <!-- Menú desplegable de redes sociales -->
            <div class="share-menu" *ngIf="shareMenuVisible">
              <a [href]="'https://www.facebook.com/sharer/sharer.php?u=' + recipeUrl" target="_blank">
                Compartir en Facebook
              </a>
              <a [href]="'https://twitter.com/intent/tweet?url=' + recipeUrl + '&text=¡Mira esta receta!'" target="_blank">
                Compartir en Twitter
              </a>
              <a [href]="'https://api.whatsapp.com/send?text=' + recipeUrl" target="_blank">
                Compartir en WhatsApp
              </a>
              <button (click)="copyLink()">Copiar enlace</button>
            </div>
          </div>
        </div>



      </div>
      <div class="ingredients">
        <h2>Ingredientes</h2>
        <label for="person-count">Número de personas:</label>
        <input type="number" id="person-count" name="person-count" value="1" min="1" max="10">
        <ul id="ingredient-list">
          <!-- Lista dinámica de ingredientes -->
          <li *ngFor="let ingredient of recipe.Ingredients">
            {{ ingredient.Ammount }} {{ ingredient.Ingredient }}
          </li>
        </ul>
      </div>
    </div>
    <!-- Nueva sección de nutrición -->
    <div class="nutrition-section">
      <h2>Nutrición por ración</h2>
      <div class="nutrition-info">
        <div class="nutrition-item">
          <span>Cal</span>
          <div class="nutrition-value">1088</div>
        </div>
        <div class="nutrition-item">
          <span>Grasa</span>
          <div class="nutrition-value">70 g</div>
        </div>
        <div class="nutrition-item">
          <span>Proteína</span>
          <div class="nutrition-value">52 g</div>
        </div>
        <div class="nutrition-item">
          <span>Carb</span>
          <div class="nutrition-value">61 g</div>
        </div>
      </div>
    </div>

    <div id="bloque_de_pasos">
      <h2>Pasos</h2>
      <app-steps-of-recipes [steps]="stepsOfRecipe"></app-steps-of-recipes>
    </div>

    <!-- Sección de recomendaciones -->
    <div>
      <h2 class="recommendations-title">Recomendaciones</h2>
      <div class="bloque">
      <app-item *ngFor="let recipe of recommendations" [recipe]="recipe" class="clickable"></app-item>
      </div>
    </div>
  </article>
</section>
