<div class="container">
  <form #registrationForm="ngForm"
        (ngSubmit)="onSubmit(registrationForm)"
        novalidate>
    <h1>Sign-in</h1>
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>
    <!-- Usuario -->
    <label class="label" for="username">Usuario:</label>
    <input
      type="email"
      id="username"
      class="input-bar"
      name="username"
      placeholder="tucorreo&#64;ejemplo.com"
      required
      ngModel
      email
      #username="ngModel"
      [class.invalid]="username.invalid && username.touched"
    />
    <div class="error" *ngIf="username.invalid && username.touched">
      "Introduzca una dirección de correo electrónico válida (ejemplo&#64;mail.com)."
    </div>

    <!-- Contraseña -->
    <label class="label" for="password">Contraseña:</label>
    <input
      type="password"
      id="password"
      class="input-bar"
      name="password"
      required
      ngModel
      title="Mínimo 8 caracteres, al menos un número, un carácter especial y una mayúscula"
      #password="ngModel"
      [class.invalid]="password.invalid && password.touched"
    />
    <div class="error" *ngIf="password.invalid && password.touched">
      Mínimo 8 caracteres, al menos un número, un carácter especial y una mayúscula.
    </div>

    <!-- Confirmar Contraseña -->
    <label class="label" for="nuevaPassword">Repetir contraseña:</label>
    <input
      type="password"
      id="nuevaPassword"
      class="input-bar"
      name="nuevaPassword"
      required
      ngModel
      #nuevaPassword="ngModel"
      [class.invalid]="(nuevaPassword.invalid && nuevaPassword.touched) || passwordMismatch"
    />
    <div class="error" *ngIf="passwordMismatch">
      Las contraseñas no coinciden.
    </div>

    <button type="submit" class="login-button" [disabled]="registrationForm.invalid">
      Sign-in
    </button>
  </form>
</div>
